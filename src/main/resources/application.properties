# Uygulama adı
spring.application.name=ReservationSystem

# Loglama ayarları
logging.file.name=reservation-system.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Sunucu ayarları
server.port=8080
server.ssl.enabled=false

# Veritabanı ayarları (H2 - geliştirme için)
spring.datasource.url=jdbc:h2:mem:reservationdb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# E-posta sunucu ayarları
# NOT: Hassas bilgileri environment variables veya application-local.properties kullanın
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# SpringDoc OpenAPI ayarları
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

